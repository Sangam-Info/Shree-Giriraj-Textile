<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shri Giriraj Textile — Jobwork System</title>
<meta name="description" content="Jobwork management for Shri Giriraj Textile — Job Work Sheet at the gate feeding ledger, billing, loans and year-end settlement.">
<meta name="theme-color" content="#0e1130">

<!-- Boot guard (bug 1): hide the login screen until Firebase auth resolves, so a
     signed-in user never sees the login form flash on a hard refresh. Auto-clears
     after 6s even if scripts fail, so the login can never be permanently hidden. -->
<script>(function(){try{document.documentElement.className+=' gj-booting';setTimeout(function(){try{document.documentElement.classList.remove('gj-booting');}catch(e){}},6000);}catch(e){}})();</script>

<!-- Build id (bug 1): bump this on every deploy, together with version.json and the
     ?v= query on the CSS/JS below (all three must match). Open tabs poll version.json
     and auto-refresh when the published build changes. -->
<script>window.__BUILD="1112l";</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23e0932a'/%3E%3Cg stroke='%233a2605' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M15 13h18M15 35h18M18 19h12M18 24h12M18 29h12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/styles.css?v=1112l">
</head>
<body>

<!-- Boot splash — shown only while <html class="gj-booting"> (see head script) -->
<div id="gjBootSplash" aria-hidden="true">
  <div class="gbs-inner">
    <img src="./img/logo.png" alt="Shri Giriraj Textile" class="gbs-logo">
    <div class="gbs-spin"></div>
    <div class="gbs-txt">Loading…</div>
  </div>
</div>

<!-- ======================= LOGIN (clean split-screen) ======================= -->
<section id="hero">
  <div class="auth-lang" id="authLang" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="on">EN</button>
    <button type="button" data-lang="gu">ગુ</button>
  </div>
  <div class="auth">

    <!-- LEFT · branding -->
    <aside class="auth-left">
      <div class="auth-brand">
        <img class="auth-logo" src="./img/logo.png" alt="Shri Giriraj Textile">
        <span class="auth-rule"></span>
        <h1 class="auth-title">Jobwork Management System</h1>
        <p class="auth-tagline">Manage <span>·</span> Track <span>·</span> Grow</p>
      </div>
    </aside>

    <!-- RIGHT · sign-in form -->
    <main class="auth-right">
      <form class="auth-card" id="loginForm" autocomplete="off" novalidate>
        <h2 class="auth-welcome">Welcome <span>Back</span></h2>
        <p class="auth-sub">Sign in to continue to your account</p>

        <div class="auth-field auth-field-select">
          <svg class="afx" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 11l2 2 4-4"/></svg>
          <select id="loginRole" aria-label="Login as role">
            <option value="admin">Admin — Full access</option>
            <option value="supervisor">Supervisor — Gate &amp; Packaging</option>
          </select>
          <svg class="afx-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <div class="auth-field">
          <svg class="afx" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="authEmail" type="email" inputmode="email" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Email Address">
        </div>

        <div class="auth-field">
          <svg class="afx" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="authPass" type="password" autocomplete="current-password" placeholder="Password">
          <button type="button" class="afx-eye" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.16 3.19M6.6 6.6A18 18 0 0 0 2 11s3.5 7 10 7a9.3 9.3 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>

        <div class="auth-row">
          <label class="auth-remember"><input type="checkbox" id="rememberMe" checked><span class="box"></span><span class="rm-txt">Remember Me</span></label>
          <a href="#" class="auth-forgot" id="forgotPw">Forgot Password?</a>
        </div>

        <div class="auth-err" id="authErr" role="alert"></div>

        <button class="auth-btn" id="enterBtn" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span>Log In</span>
        </button>

        <div class="auth-secure"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="sa-txt">Secure Access</span></span></div>
        <p class="auth-foot" id="authFoot">Shri Giriraj Textile <span>·</span> Jobwork Management System</p>
      </form>
    </main>

  </div>
</section>

<!-- ======================= APP ======================= -->
<div id="app">
  <header class="appbar">
    <div class="brand">
      <span style="display:inline-flex;align-items:center"><img src="./img/logo.png" alt="Shri Giriraj Textile" style="height:34px;width:auto;display:block"></span>
    </div>
    <div class="spacer"></div>

    <div class="worker-switch">
      <span class="lbl" id="workerLbl">જોબ વર્કર</span>
      <select id="workerSelect" aria-label="Select job worker"></select>
    </div>
    <div class="month-switch">
      <button class="btn btn-sm btn-ghost" id="monthPrev" aria-label="Previous month" style="min-height:34px;padding:0 8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <select id="monthSelect" class="mlabel" aria-label="Select month"></select>
      <button class="btn btn-sm btn-ghost" id="monthNext" aria-label="Next month" style="min-height:34px;padding:0 8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>

    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="langGu" class="on" type="button">ગુજરાતી</button>
      <button id="langEn" type="button">English</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="view"></main>
  </div>
  <nav class="botnav" id="botnav"></nav>

  <!-- Global Back button — fixed bottom-right on every screen except the dashboard home -->
  <button type="button" id="backFab" class="back-fab" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <span class="bf-txt">Back</span>
  </button>
</div>

<div class="print-stage" id="printStage" aria-hidden="true"></div>
<div class="modal-back" id="modalBack"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Firebase (compat SDK — no build step). Demo mode until firebase-config.js holds real values. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./js/firebase-config.js?v=1112l"></script>

<script src="./js/app.js?v=1112l"></script>
<script src="./js/auth.js?v=1112l"></script>
<script src="./js/db.js?v=1112l"></script>
</body>
</html>
